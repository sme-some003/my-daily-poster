<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my_daily_poster - Connected</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222}
code{display:block;background:#f2f2f2;padding:12px;word-break:break-all}</style>
</head>
<body>
<h1>TikTok login result</h1>
<p id="msg">Reading result...</p>
<code id="code"></code>
<script>
  // Shows the authorization code from TikTok so it can be pasted into the local tool.
  var p = new URLSearchParams(window.location.search);
  var msg = document.getElementById("msg");
  var box = document.getElementById("code");
  if (p.get("code")) {
    msg.textContent = "Success. Copy the code below and paste it into the tool (valid for a few minutes):";
    box.textContent = p.get("code");
  } else {
    msg.textContent = "No code received. " + (p.get("error_description") || p.get("error") || "");
    box.style.display = "none";
  }
</script>
</body>
</html>
